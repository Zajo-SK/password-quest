<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <title>Password Quest – testy</title>
  <style>
    body { font: 16px system-ui, sans-serif; margin: 24px; background: #0a1230; color: #eaf1ff; }
    li.ok { color: #3ddc97; } li.fail { color: #ff7f90; font-weight: 700; }
    #summary { font-size: 1.3rem; margin: 12px 0; }
  </style>
</head>
<body>
  <h1>Password Quest – testy v prehliadači</h1>
  <p>Otvor túto stránku cez lokálny server (napr. <code>python3 -m http.server</code> v koreňovom priečinku a potom <code>/tests/</code>).</p>
  <p id="summary">Beží…</p>
  <ul id="out"></ul>
  <script type="module">
    import { CONTENT } from '../js/content/index.js';
    import { DICTS, setLang, getLang, t } from '../js/i18n.js';
    import { CARDS, COMMON } from '../js/wordlists.js';
    import { checkPassword, splitWords, drawCards, drawCardSet, cardWord, normalize } from '../js/lab.js';
    import { newClassCode, buildCsv } from '../js/teacher.js';

    const out = document.getElementById('out');
    let pass = 0, fail = 0;
    function test(name, fn) {
      let ok = true, msg = '';
      try { fn(); } catch (e) { ok = false; msg = e.message; }
      ok ? pass++ : fail++;
      const li = document.createElement('li');
      li.className = ok ? 'ok' : 'fail';
      li.textContent = (ok ? '✓ ' : '✗ ') + name + (msg ? ' – ' + msg : '');
      out.append(li);
    }
    const eq = (a, b, m) => { if (a !== b) throw new Error(`${m || ''} očakávané ${b}, dostali sme ${a}`); };
    const truthy = (v, m) => { if (!v) throw new Error(m || 'nepravda'); };
    const originalLang = getLang();
    const LANG_IDS = Object.keys(CONTENT);

    // --- Dielňa hesiel: kontrola hesla (v oboch jazykoch) ---
    const ok = (pw, id, terms) => checkPassword(pw, terms).checks.find((c) => c.id === id).ok;
    test('slová v hesle sa rozpoznajú podľa veľkých písmen aj oddeľovačov', () => {
      eq(splitWords('SlonDazdnikRaketa').join(), 'Slon,Dazdnik,Raketa');
      eq(splitWords('slon-dazdnik raketa').length, 3);
      eq(splitWords('Macko123!').join(), 'Macko');
      eq(splitWords('ŤavaĎalekohľadSlon').length, 3);
    });
    for (const lang of LANG_IDS) {
      setLang(lang);
      test(`[${lang}] prázdne heslo`, () => eq(checkPassword('').step, 0));
      test(`[${lang}] bežné heslá sú slabé`, () => ['123456', 'heslo', 'password', 'P@ssw0rd', 'qwertyuiop'].forEach((pw) => eq(checkPassword(pw).step, 1, pw)));
      test(`[${lang}] slovo + čísla je slabé`, () => { eq(checkPassword('Macko123').step, 1); eq(ok('Macko123!', 'common'), false); });
      test(`[${lang}] slovo + rok nie je silné`, () => { eq(ok('Futbal2026', 'pattern'), false); truthy(checkPassword('Futbal2026').step <= 2); });
      test(`[${lang}] tri náhodné slová sú silné`, () => { const r = checkPassword('SlonDazdnikRaketa'); eq(r.step, 3); truthy(r.checks.every((c) => c.ok)); });
      test(`[${lang}] rovnaké písmená na hranici slov nevadia`, () => eq(checkPassword('HillLionTractor').step, 3));
      test(`[${lang}] štyri slová sú výborné`, () => eq(checkPassword('SlonDazdnikRaketaKotva').step, 4));
      test(`[${lang}] dve slová nestačia`, () => { eq(checkPassword('SlonDazdnik').step, 2); eq(ok('SlonDazdnik', 'three'), false); });
      test(`[${lang}] bežné slovo v hesle sa nájde`, () => { eq(ok('SlonHesloRaketa', 'common'), false); eq(checkPassword('SlonHesloRaketa').step, 2); });
      test(`[${lang}] krátke slová dostanú radu`, () => { const r = checkPassword('PesLesMak'); truthy(r.step <= 2); });
      test(`[${lang}] osobný údaj z profilu`, () => { eq(ok('RexLampaSkala', 'personal', ['Rex']), false); eq(checkPassword('KotvaLampaSkala', ['Rex']).step, 3); });
      test(`[${lang}] texty kontrol sú preložené`, () => checkPassword('Futbal2026', ['Rex']).checks.forEach((c) => truthy(!c.text.startsWith('ws.'), c.text)));
      test(`[${lang}] kartičky: 3 rôzne slová`, () => { const c = drawCards(3, lang); eq(c.length, 3); eq(new Set(c.map((x) => x[1])).size, 3); });
      test(`[${lang}] kartičky nie sú bežné slová a dajú sa písať bez diakritiky`, () => CARDS[lang].forEach(([, w]) => { truthy(!COMMON.has(normalize(w)), w); truthy(/^[A-Z][a-z]+$/.test(cardWord(w)), cardWord(w)); }));
      test(`[${lang}] heslo z troch kartičiek je vždy silné`, () => { for (let i = 0; i < 200; i++) { const pw = drawCardSet(lang).map(([, w]) => cardWord(w)).join(''); truthy(checkPassword(pw).step >= 3, pw); } });
    }

    test('kód triedy má správny formát', () => truthy(/^[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$/.test(newClassCode())));
    test('kódy tried sú rôzne', () => truthy(new Set(Array.from({ length: 50 }, newClassCode)).size === 50));
    test('CSV obsahuje hlavičku', () => { setLang('sk'); truthy(buildCsv().includes('typ;id;nazov')); });

    // --- Slovníky rozhrania ---
    test('slovníky SK a EN majú rovnaké kľúče', () => {
      const sk = Object.keys(DICTS.sk), en = Object.keys(DICTS.en);
      const missingEn = sk.filter((k) => !(k in DICTS.en)), missingSk = en.filter((k) => !(k in DICTS.sk));
      truthy(!missingEn.length && !missingSk.length, `chýba v EN: ${missingEn.join(', ')} | chýba v SK: ${missingSk.join(', ')}`);
    });
    const files = ['main.js', 'views.js', 'engine.js', 'lab.js', 'teacher.js', 'icons.js'];
    const sources = await Promise.all(files.map((f) => fetch('../js/' + f, { cache: 'no-store' }).then((r) => r.text())));
    test('všetky statické kľúče t(…) v kóde existujú v slovníkoch', () => {
      const keys = new Set(sources.flatMap((s) => [...s.matchAll(/\bt\('([^']+)'\s*[,)]/g)].map((m) => m[1])));
      const missing = [...keys].filter((k) => !(k in DICTS.sk) || !(k in DICTS.en));
      truthy(!missing.length, missing.join(', '));
    });
    test('dynamické kľúče existujú', () => {
      const dyn = [
        ...[1, 2, 3, 4, 5, 6].flatMap((n) => [`howto.s${n}.t`, `howto.s${n}.d`]),
        ...Object.keys(CONTENT.sk.meta.TOPICS).map((id) => `learn.topic.${id}`),
        ...[0, 1, 2, 3, 4].flatMap((n) => [`ws.step.${n}`, `ws.step.${n}.d`]),
        ...[1, 2, 3].flatMap((n) => [`ws.why${n}`, `ws.limit${n}`]),
        ...[1, 2, 3, 4].map((n) => `difficulty.${n}`),
        ...[1, 2, 3, 4, 5].map((n) => `teacher.priv${n}`),
        'rank.novice', 'rank.guardian', 'rank.detective', 'rank.expert',
      ];
      const missing = dyn.filter((k) => !(k in DICTS.sk) || !(k in DICTS.en));
      truthy(!missing.length, missing.join(', '));
    });
    test('funkčné texty (množné číslo) fungujú', () => {
      setLang('sk');
      eq(t('task.n_tasks', { n: 1 }), '1 úloha'); eq(t('task.n_tasks', { n: 3 }), '3 úlohy'); eq(t('task.n_tasks', { n: 5 }), '5 úloh');
      setLang('en');
      eq(t('task.n_tasks', { n: 1 }), '1 task'); eq(t('task.n_tasks', { n: 6 }), '6 tasks');
    });

    // --- Integrita obsahu v každom jazyku ---
    for (const lang of LANG_IDS) {
      const { levels, meta } = CONTENT[lang];
      const tasks = levels.flatMap((l) => l.tasks);
      test(`[${lang}] 4 úrovne, každá s aspoň 4 misiami`, () => { eq(levels.length, 4); levels.forEach((l) => truthy(l.tasks.length >= 4, 'úroveň ' + l.id)); });
      test(`[${lang}] id úloh a kôl sú jedinečné`, () => { const ids = tasks.flatMap((x) => [x.id, ...x.rounds.map((r) => r.id)]); eq(new Set(ids).size, ids.length); });
      test(`[${lang}] každá misia má aspoň 4 kolá a známu tému`, () => tasks.forEach((x) => { truthy(x.rounds.length >= 4, x.id); truthy(meta.TOPICS[x.topic], x.id); x.rounds.forEach((r) => truthy(meta.TOPICS[r.topic], r.id)); }));
      test(`[${lang}] choice má práve jednu správnu odpoveď`, () => tasks.forEach((x) => x.rounds.filter((r) => r.type === 'choice').forEach((r) => eq(r.options.filter((o) => o.correct).length, 1, r.id))));
      test(`[${lang}] každá odpoveď má vysvetlenie a každé kolo zhrnutie`, () => tasks.forEach((x) => x.rounds.forEach((r) => { truthy(r.summary, r.id); (r.options || []).forEach((o) => truthy(o.why, r.id)); })));
      test(`[${lang}] rows: správna kategória existuje`, () => tasks.forEach((x) => x.rounds.filter((r) => r.type === 'rows').forEach((r) => r.rows.forEach((row) => {
        if (row.options) eq(row.options.filter((o) => o.correct).length, 1, r.id); else truthy(r.categories.some((c) => c.id === row.answer), r.id);
      }))));
      test(`[${lang}] odznaky majú názov a popis`, () => Object.values(meta.BADGES).forEach((b) => { truthy(b.name); truthy(b.desc); }));
      test(`[${lang}] obsah používa len vymyslené domény (.example, .test)`, () => {
        const text = JSON.stringify(tasks);
        [...text.matchAll(/https?:\/\/([^\/"\s]+)/g)].map((m) => m[1]).forEach((host) => truthy(/\.(example|test)$/.test(host), host));
      });
    }

    // --- Zhoda štruktúry SK a EN (rovnaké odpovede, poradie a id) ---
    const shape = (r) => JSON.stringify({
      id: r.id, type: r.type, topic: r.topic, mock: !!r.mock, scenario: !!r.scenario,
      options: (r.options || []).map((o) => !!o.correct + (o.icon || '')),
      cats: (r.categories || []).map((c) => c.id),
      rows: (r.rows || []).map((x) => x.answer || (x.options || []).map((o) => !!o.correct).join()),
      items: (r.items || []).map((i) => i.tier),
      flags: r.type === 'hotspot' ? [r.mock.from, r.mock.subject, ...r.mock.paragraphs.flat()].map((p) => (typeof p === 'object' ? `${!!p.pick}${!!p.flag}${!!p.link}` : 's')) : [],
      goal: r.goal || null, accounts: (r.accounts || []).map((a) => a.id), leakFrom: r.leakFrom || null,
    });
    test('SK a EN majú rovnakú štruktúru úrovní, misií a kôl', () => {
      CONTENT.sk.levels.forEach((l, li) => {
        const e = CONTENT.en.levels[li];
        eq(e.id, l.id); eq(e.badge, l.badge); eq(e.color, l.color); eq(e.tasks.length, l.tasks.length, `úroveň ${l.id}`);
        l.tasks.forEach((x, ti) => {
          const y = e.tasks[ti];
          eq(y.id, x.id); eq(y.badge, x.badge); eq(y.topic, x.topic); eq(!!y.planTitle, !!x.planTitle); eq(y.rounds.length, x.rounds.length, x.id);
          x.rounds.forEach((r, ri) => eq(shape(y.rounds[ri]), shape(r), r.id));
        });
      });
    });

    // --- Jazyková kontrola: známe chyby sa nevrátili ---
    test('slovenský obsah neobsahuje opravené chyby', () => {
      const text = JSON.stringify(CONTENT.sk) + JSON.stringify(DICTS.sk, (k, v) => (typeof v === 'function' ? String(v) : v));
      ['vykričník', 'Rozdeľ hesla', 'hesla sa zmenia', 'má pes ', 'Pri problému', 'nebojí trestu', 'vydierajú', 'a mená.'].forEach((bad) => truthy(!text.includes(bad), bad));
    });

    // --- Úložisko: nikdy nie heslá ---
    test('localStorage neobsahuje zadané testovacie heslá', () => {
      const raw = JSON.stringify(Object.fromEntries(Object.keys(localStorage).map((k) => [k, localStorage.getItem(k)])));
      truthy(!raw.includes('SlonDazdnikRaketa'));
    });

    setLang(originalLang);
    document.getElementById('summary').textContent = `Hotovo: ${pass} úspešných, ${fail} neúspešných`;
    document.getElementById('summary').style.color = fail ? '#ff7f90' : '#3ddc97';
    document.title = fail ? 'TESTY ZLYHALI' : 'TESTY OK';
  </script>
</body>
</html>
