<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <title>Password Quest – testy</title>
  <style>
    body { font: 16px system-ui, sans-serif; margin: 24px; background: #0a1230; color: #eaf1ff; }
    li.ok { color: #3ddc97; } li.fail { color: #ff7f90; font-weight: 700; }
    #summary { font-size: 1.3rem; margin: 12px 0; }
  </style>
</head>
<body>
  <h1>Password Quest – testy v prehliadači</h1>
  <p>Otvor túto stránku cez lokálny server (napr. <code>python3 -m http.server</code> v koreňovom priečinku a potom <code>/tests/</code>).</p>
  <p id="summary">Beží…</p>
  <ul id="out"></ul>
  <script type="module">
    import { CONTENT } from '../js/content/index.js';
    import { DICTS, LANGS, setLang, getLang, t } from '../js/i18n.js';
    import { GLOSSARY, findTerms, termsIn, textsOf, annotate } from '../js/glossary.js';
    import { CARDS, COMMON } from '../js/wordlists.js';
    import { checkPassword, splitWords, drawCards, drawCardSet, cardWord, normalize } from '../js/lab.js';
    import { newClassCode, buildCsv } from '../js/teacher.js';
    import { mockParts } from '../js/content/helpers.js';
    import { LETTERS, alphabet, encode, decode, same, plain, randomAlphabet } from '../js/cipher.js';

    const out = document.getElementById('out');
    let pass = 0, fail = 0;
    function test(name, fn) {
      let ok = true, msg = '';
      try { fn(); } catch (e) { ok = false; msg = e.message; }
      ok ? pass++ : fail++;
      const li = document.createElement('li');
      li.className = ok ? 'ok' : 'fail';
      li.textContent = (ok ? '✓ ' : '✗ ') + name + (msg ? ' – ' + msg : '');
      out.append(li);
    }
    const eq = (a, b, m) => { if (a !== b) throw new Error(`${m || ''} očakávané ${b}, dostali sme ${a}`); };
    const truthy = (v, m) => { if (!v) throw new Error(m || 'nepravda'); };
    const originalLang = getLang();
    const LANG_IDS = Object.keys(CONTENT);

    // --- Dielňa hesiel: kontrola hesla (v oboch jazykoch) ---
    const ok = (pw, id, terms) => checkPassword(pw, terms).checks.find((c) => c.id === id).ok;
    test('slová v hesle sa rozpoznajú podľa veľkých písmen aj oddeľovačov', () => {
      eq(splitWords('SlonDazdnikRaketa').join(), 'Slon,Dazdnik,Raketa');
      eq(splitWords('slon-dazdnik raketa').length, 3);
      eq(splitWords('Macko123!').join(), 'Macko');
      eq(splitWords('ŤavaĎalekohľadSlon').length, 3);
    });
    for (const lang of LANG_IDS) {
      setLang(lang);
      test(`[${lang}] prázdne heslo`, () => eq(checkPassword('').step, 0));
      test(`[${lang}] bežné heslá sú slabé`, () => ['123456', 'heslo', 'password', 'P@ssw0rd', 'qwertyuiop'].forEach((pw) => eq(checkPassword(pw).step, 1, pw)));
      test(`[${lang}] slovo + čísla je slabé`, () => { eq(checkPassword('Macko123').step, 1); eq(ok('Macko123!', 'common'), false); });
      test(`[${lang}] slovo + rok nie je silné`, () => { eq(ok('Futbal2026', 'pattern'), false); truthy(checkPassword('Futbal2026').step <= 2); });
      test(`[${lang}] tri náhodné slová sú silné`, () => { const r = checkPassword('SlonDazdnikRaketa'); eq(r.step, 3); truthy(r.checks.every((c) => c.ok)); });
      test(`[${lang}] rovnaké písmená na hranici slov nevadia`, () => eq(checkPassword('HillLionTractor').step, 3));
      test(`[${lang}] štyri slová sú výborné`, () => eq(checkPassword('SlonDazdnikRaketaKotva').step, 4));
      test(`[${lang}] dve slová nestačia`, () => { truthy(checkPassword('SlonDazdnik').step <= 2); eq(ok('SlonDazdnik', 'words'), false); eq(checkPassword('SlonDazdnikRaketa').step, 3); });
      test(`[${lang}] bežné slovo v hesle sa nájde`, () => { eq(ok('SlonHesloRaketa', 'common'), false); eq(checkPassword('SlonHesloRaketa').step, 2); });
      test(`[${lang}] krátke slová dostanú radu`, () => { const r = checkPassword('PesLesMak'); truthy(r.step <= 2); });
      test(`[${lang}] osobný údaj z profilu`, () => { eq(ok('RexLampaSkala', 'personal', ['Rex']), false); eq(checkPassword('KotvaLampaSkala', ['Rex']).step, 3); });
      test(`[${lang}] texty kontrol sú preložené`, () => checkPassword('Futbal2026', ['Rex']).checks.forEach((c) => truthy(!c.text.startsWith('ws.'), c.text)));
      test(`[${lang}] tri krátke slová nestačia (menej ako 15 znakov)`, () => { const r = checkPassword('SlonKotvaLev'); eq(r.step, 2); eq(ok('SlonKotvaLev', 'length'), false); });
      test(`[${lang}] opakované slová sú vzor`, () => { eq(ok('KotvaKotvaKotvaKotva', 'pattern'), false); truthy(checkPassword('KotvaKotvaKotvaKotva').step <= 2); });
      test(`[${lang}] náhodné heslo zo správcu hesiel je silné`, () => { const r = checkPassword('q7#Rm2!vXp9&Lk4z'); truthy(r.generated); eq(r.step, 3); eq(checkPassword('q7#Rm2!vXp9&Lk4zT8$w').step, 4); });
      test(`[${lang}] krátky náhodný reťazec nie je silný`, () => truthy(checkPassword('k7#Qm2!x').step <= 2));
      test(`[${lang}] uniknuté a známe heslá sú slabé`, () => ['Password123', 'qwerty123', 'mojeheslo', 'iloveyou1'].forEach((pw) => eq(checkPassword(pw).step, 1, pw)));
      test(`[${lang}] kartičky: 4 a 5 slov`, () => [4, 5].forEach((n) => { const c = drawCardSet(lang, n); eq(c.length, n); truthy(checkPassword(c.map(([, w]) => cardWord(w)).join('')).step >= 3); }));
      test(`[${lang}] kartičiek je aspoň 200`, () => truthy(CARDS[lang].length >= 200, CARDS[lang].length));
      test(`[${lang}] kartičky: 3 rôzne slová`, () => { const c = drawCards(3, lang); eq(c.length, 3); eq(new Set(c.map((x) => x[1])).size, 3); });
      test(`[${lang}] kartičky nie sú bežné slová a dajú sa písať bez diakritiky`, () => CARDS[lang].forEach(([, w]) => { truthy(!COMMON.has(normalize(w)), w); truthy(/^[A-Z][a-z]+$/.test(cardWord(w)), cardWord(w)); }));
      test(`[${lang}] heslo z troch kartičiek je vždy silné`, () => { for (let i = 0; i < 200; i++) { const pw = drawCardSet(lang).map(([, w]) => cardWord(w)).join(''); truthy(checkPassword(pw).step >= 3, pw); } });
    }

    test('kód triedy má správny formát', () => truthy(/^[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$/.test(newClassCode())));
    test('kódy tried sú rôzne', () => truthy(new Set(Array.from({ length: 50 }, newClassCode)).size === 50));
    test('CSV obsahuje hlavičku', () => { setLang('sk'); truthy(buildCsv().includes('typ;id;nazov')); });

    // --- Slovníky rozhrania ---
    const DICT_IDS = Object.keys(DICTS);
    const inAll = (k) => DICT_IDS.every((l) => k in DICTS[l]);
    test('slovníky všetkých jazykov majú rovnaké kľúče ako SK', () => DICT_IDS.filter((l) => l !== 'sk').forEach((l) => {
      const sk = Object.keys(DICTS.sk), other = Object.keys(DICTS[l]);
      const missing = sk.filter((k) => !(k in DICTS[l])), extra = other.filter((k) => !(k in DICTS.sk));
      truthy(!missing.length && !extra.length, `${l}: chýba ${missing.join(', ')} | navyše ${extra.join(', ')}`);
    }));
    test('každý jazyk obsahu má slovník rozhrania a jazyk v prepínači', () => LANG_IDS.forEach((l) => { truthy(DICTS[l], l); truthy(LANGS.some((x) => x.id === l), l); }));
    const files = ['main.js', 'views.js', 'engine.js', 'lab.js', 'teacher.js', 'icons.js', 'cipherPage.js'];
    const sources = await Promise.all(files.map((f) => fetch('../js/' + f, { cache: 'no-store' }).then((r) => r.text())));
    test('všetky statické kľúče t(…) v kóde existujú v slovníkoch', () => {
      const keys = new Set(sources.flatMap((s) => [...s.matchAll(/\bt\('([^']+)'\s*[,)]/g)].map((m) => m[1])));
      const missing = [...keys].filter((k) => !inAll(k));
      truthy(!missing.length, missing.join(', '));
    });
    test('dynamické kľúče existujú', () => {
      const dyn = [
        ...[1, 2, 3, 4, 5, 6].flatMap((n) => [`howto.s${n}.t`, `howto.s${n}.d`]),
        ...Object.keys(CONTENT.sk.meta.TOPICS).map((id) => `learn.topic.${id}`),
        ...[0, 1, 2, 3, 4].flatMap((n) => [`ws.step.${n}`, `ws.step.${n}.d`]),
        ...[1, 2, 3, 4].flatMap((n) => [`ws.why${n}`, `ws.limit${n}`]),
        'gl.mission', 'gl.round', 'gl.term_aria', 'gl.close', 'gl.all_link',
        ...[1, 2, 3, 4].flatMap((n) => [`basis.o${n}.t`, `basis.o${n}.d`]),
        ...[1, 2, 3, 4, 5, 6, 7, 8].flatMap((n) => ['t', 's', 'a'].map((k) => `basis.p${n}.${k}`)),
        ...[1, 2, 3].map((n) => `basis.limit${n}`),
        ...[1, 2, 3, 4, 5, 6].map((n) => `basis.s${n}`),
        ...[1, 2, 3, 4].map((n) => `difficulty.${n}`),
        ...[1, 2, 3, 4].map((n) => `email.how${n}`),
        ...[1, 2].flatMap((l) => ['title', 'lead', 'grade', 'goal1', 'goal2', 'goal3'].map((k) => `mat.l${l}.${k}`)),
        ...[1, 2, 3, 4].map((n) => `mat.tip${n}`),
        ...[1, 2, 3, 4, 5].map((n) => `teacher.priv${n}`),
        'rank.novice', 'rank.guardian', 'rank.detective', 'rank.expert',
      ];
      const missing = dyn.filter((k) => !inAll(k));
      truthy(!missing.length, missing.join(', '));
    });
    test('funkčné texty (množné číslo) fungujú', () => {
      setLang('sk');
      eq(t('task.n_tasks', { n: 1 }), '1 úloha'); eq(t('task.n_tasks', { n: 3 }), '3 úlohy'); eq(t('task.n_tasks', { n: 5 }), '5 úloh');
      setLang('en');
      eq(t('task.n_tasks', { n: 1 }), '1 task'); eq(t('task.n_tasks', { n: 6 }), '6 tasks');
      setLang('zh');
      eq(t('task.n_tasks', { n: 6 }), '6 道题');
    });

    // --- Integrita obsahu v každom jazyku ---
    for (const lang of LANG_IDS) {
      const { modules, meta } = CONTENT[lang];
      const levels = Object.values(modules).flat();
      const tasks = levels.flatMap((l) => l.tasks);
      test(`[${lang}] moduly majú 4 úrovne obtiažnosti`, () => { eq(Object.keys(modules).join(), 'password-quest,email-detective'); Object.values(modules).forEach((ls) => { eq(ls.length, 4); ls.forEach((l, i) => eq(l.n, i + 1, l.id)); }); });
      test(`[${lang}] Password Quest má v každej úrovni aspoň 6 misií, Detektív e-mailov aspoň 4`, () => Object.entries(modules).forEach(([id, ls]) => ls.forEach((l) => truthy(l.tasks.length >= (id === 'password-quest' ? 6 : 4), 'úroveň ' + l.id))));
      test(`[${lang}] id úrovní sú jedinečné a odznaky úrovní existujú`, () => { eq(new Set(levels.map((l) => String(l.id))).size, levels.length); levels.forEach((l) => truthy(meta.BADGES[l.badge], l.id)); });
      test(`[${lang}] moduly majú názov a popis`, () => Object.keys(modules).forEach((id) => { truthy(meta.MODULES[id].name, id); truthy(meta.MODULES[id].summary, id); }));
      test(`[${lang}] schránka: každý e-mail má odosielateľa, predmet, vysvetlenie a je aspoň jeden podvod aj jeden pravý`, () => tasks.forEach((x) => x.rounds.filter((r) => r.type === 'inbox').forEach((r) => {
        truthy(r.emails.length >= 3, r.id); truthy(r.emails.some((e) => e.scam) && r.emails.some((e) => !e.scam), r.id);
        r.emails.forEach((e) => { truthy(e.from && e.subject && e.why, r.id); truthy(e.paragraphs.length >= 1, r.id); });
      })));
      test(`[${lang}] id úloh a kôl sú jedinečné`, () => { const ids = tasks.flatMap((x) => [x.id, ...x.rounds.map((r) => r.id)]); eq(new Set(ids).size, ids.length); });
      test(`[${lang}] každá misia má aspoň 4 kolá a známu tému`, () => tasks.forEach((x) => { truthy(x.rounds.length >= 4, x.id); truthy(meta.TOPICS[x.topic], x.id); x.rounds.forEach((r) => truthy(meta.TOPICS[r.topic], r.id)); }));
      test(`[${lang}] choice má práve jednu správnu odpoveď`, () => tasks.forEach((x) => x.rounds.filter((r) => r.type === 'choice').forEach((r) => eq(r.options.filter((o) => o.correct).length, 1, r.id))));
      test(`[${lang}] každá odpoveď má vysvetlenie a každé kolo zhrnutie`, () => tasks.forEach((x) => x.rounds.forEach((r) => { truthy(r.summary, r.id); (r.options || []).forEach((o) => truthy(o.why, r.id)); })));
      test(`[${lang}] rows: správna kategória existuje`, () => tasks.forEach((x) => x.rounds.filter((r) => r.type === 'rows').forEach((r) => r.rows.forEach((row) => {
        if (row.options) eq(row.options.filter((o) => o.correct).length, 1, r.id); else truthy(r.categories.some((c) => c.id === row.answer), r.id);
      }))));
      test(`[${lang}] každý odznak sa dá získať`, () => {
        const given = new Set([...levels.map((l) => l.badge), ...tasks.map((x) => x.badge)].filter(Boolean));
        Object.keys(meta.BADGES).forEach((b) => truthy(given.has(b), b));
      });
      test(`[${lang}] šifry: slovo sa dá zašifrovať aj rozlúštiť a možnosti obsahujú správnu odpoveď`, () => tasks.forEach((x) => x.rounds.filter((r) => r.type === 'cipher').forEach((r) => {
        truthy(/^[A-Z ]+$/.test(plain(r.text)), r.id);
        truthy(same(decode(encode(r.text, r.alphabet), r.alphabet), r.text), r.id + ' roundtrip');
        truthy(r.why, r.id + ' why');
        if (r.choices) {
          truthy(r.choices.some((c) => same(c, r.text)), r.id + ' choices');
          eq(new Set(r.choices.map((c) => encode(c, r.alphabet))).size, r.choices.length, r.id + ' rovnaké možnosti');
        }
      })));
      test(`[${lang}] označovanie: každá ukážka má časti na označenie`, () => tasks.forEach((x) => x.rounds.filter((r) => r.type === 'hotspot').forEach((r) => truthy(mockParts(r.mock).some((p) => p.pick), r.id))));
      test(`[${lang}] odznaky majú názov a popis`, () => Object.values(meta.BADGES).forEach((b) => { truthy(b.name); truthy(b.desc); }));
      test(`[${lang}] obsah používa len vymyslené domény (.example, .test)`, () => {
        const text = JSON.stringify(tasks);
        [...text.matchAll(/https?:\/\/([a-z0-9][^\/"\s“”„]*)/gi)].map((m) => m[1]).forEach((host) => truthy(/\.(example|test)$/.test(host), host));
      });
    }

    // --- Zhoda štruktúry SK a EN (rovnaké odpovede, poradie a id) ---
    const shape = (r) => JSON.stringify({
      id: r.id, type: r.type, topic: r.topic, mock: !!r.mock, scenario: !!r.scenario,
      options: (r.options || []).map((o) => !!o.correct + (o.icon || '')),
      cats: (r.categories || []).map((c) => c.id),
      rows: (r.rows || []).map((x) => x.answer || (x.options || []).map((o) => !!o.correct).join()),
      items: (r.items || []).map((i) => i.tier),
      flags: r.type === 'hotspot' ? mockParts(r.mock).map((p) => `${!!p.pick}${!!p.flag}${!!p.link}`) : [],
      mockKind: r.mock ? r.mock.kind : null,
      cipher: r.type === 'cipher' ? [typeof r.alphabet === 'object' ? JSON.stringify(r.alphabet) : r.alphabet, r.mode, (r.choices || []).length, r.table] : null,
      goal: r.goal || null, accounts: (r.accounts || []).map((a) => a.id), leakFrom: r.leakFrom || null,
      emails: (r.emails || []).map((e) => `${e.scam}${!!e.attachment}${e.paragraphs.length}`), attachment: !!(r.mock && r.mock.attachment),
    });
    LANG_IDS.filter((lang) => lang !== 'sk').forEach((lang) => test(`SK a ${lang.toUpperCase()} majú rovnakú štruktúru modulov, úrovní, misií a kôl`, () => {
      eq(Object.keys(CONTENT[lang].modules).join(), Object.keys(CONTENT.sk.modules).join());
      Object.entries(CONTENT.sk.modules).forEach(([mod, skLevels]) => skLevels.forEach((l, li) => {
        const e = CONTENT[lang].modules[mod][li];
        eq(e.id, l.id); eq(e.badge, l.badge); eq(e.color, l.color); eq(e.tasks.length, l.tasks.length, `úroveň ${l.id}`);
        l.tasks.forEach((x, ti) => {
          const y = e.tasks[ti];
          eq(y.id, x.id); eq(y.badge, x.badge); eq(y.topic, x.topic); eq(!!y.planTitle, !!x.planTitle); eq(y.rounds.length, x.rounds.length, x.id);
          x.rounds.forEach((r, ri) => eq(shape(y.rounds[ri]), shape(r), r.id));
        });
      }));
    }));

    // --- Šifrovacie abecedy ---
    test('šifry: všetky abecedy vedia zašifrovať a rozlúštiť celú abecedu', () => {
      ['bot', 'leet', 'rot13', 'caesar1', 'caesar3', 'caesar25', randomAlphabet()].forEach((id) => {
        eq(decode(encode(LETTERS, id), id), LETTERS, typeof id === 'string' ? id : 'náhodná');
      });
    });
    test('šifry: Caesar s posunom 3 a ROT13', () => { eq(encode('ABC xyz', 'caesar3'), 'DEF ABC'); eq(encode(encode('HESLO', 'rot13'), 'rot13'), 'HESLO'); });
    test('šifry: diakritika sa pred šifrovaním odstráni', () => eq(encode('Ďateľ', 'caesar1'), 'EBUFM'));
    test('šifry: náhodná abeceda má pre každé písmeno iný znak', () => { const a = randomAlphabet(); eq(new Set(Object.values(a)).size, 26); });
    test('šifry: Botova abeceda nemá dva rovnaké obrázky', () => { const a = alphabet('bot'); eq(new Set(Object.values(a)).size, 26); });

    // --- Slovníček pojmov ---
    test('slovníček: SK a EN majú rovnaké pojmy', () => eq(GLOSSARY.sk.map((x) => x.id).filter((id) => id !== 'subdomain').join(), GLOSSARY.en.map((x) => x.id).filter((id) => id !== 'subdomain').join()));
    for (const lang of ['sk', 'en']) {
      test(`[${lang}] slovníček: každý pojem má vysvetlenie a nájde sa vo vlastnom názve`, () => GLOSSARY[lang].forEach((x) => { truthy(x.def && x.def.length > 30, x.id); const f = findTerms(x.name, lang); truthy(f.length && f[0].term.id === x.id, x.id); }));
      test(`[${lang}] slovníček: každý pojem sa vyskytuje v obsahu misií`, () => {
        const used = new Set(termsIn(textsOf(CONTENT[lang].modules), lang).map((x) => x.id));
        GLOSSARY[lang].forEach((x) => truthy(used.has(x.id), x.id));
      });
    }
    test('slovníček: slovenské tvary slov sa nájdu', () => {
      eq(findTerms('Skutočná doména je iná.', 'sk')[0].term.id, 'domain');
      eq(findTerms('Pozri sa na doménu.', 'sk')[0].term.id, 'domain');
      eq(findTerms('Použi správcu hesiel.', 'sk')[0].term.id, 'manager');
      eq(findTerms('Povedz to správcovi.', 'sk')[0].term.id, 'admin');
      eq(findTerms('Zapni prístupový kľúč.', 'sk')[0].term.id, 'passkey');
      eq(findTerms('portal is a subdomain', 'en')[0].term.id, 'subdomain');
      eq(findTerms('Kodomény nie sú slovo.', 'sk').length, 0);
    });
    test('slovníček: pojem sa označí v texte, ale nie v tlačidle', () => {
      const box = document.createElement('div');
      box.innerHTML = '<p>Skutočná doména je pred lomítkom. Doména znova.</p><button>doména v tlačidle</button>';
      annotate(box, new Set(), 'sk');
      eq(box.querySelectorAll('p .term').length, 1);
      eq(box.querySelectorAll('button .term').length, 0);
      truthy(box.querySelector('p').textContent.startsWith('Skutočná doména je'));
    });
    test('slovníček: v čínštine sa nič neoznačí', () => eq(findTerms('domain doména', 'zh').length, 0));

    // --- Materiály pre učiteľov: všetky súbory na stiahnutie existujú ---
    const materialFiles = ['sk/hodina-1-bezpecne-hesla', 'sk/hodina-2-podvodne-emaily', 'en/lesson-1-safe-passwords', 'en/lesson-2-scam-emails']
      .flatMap((f) => [`../materials/${f}.pdf`, `../materials/${f}.html`]).concat('../materials/print.css');
    const materialStatus = await Promise.all(materialFiles.map((f) => fetch(f, { method: 'HEAD', cache: 'no-store' }).then((r) => [f, r.ok]).catch(() => [f, false])));
    test('materiály pre učiteľov sú dostupné', () => { const missing = materialStatus.filter(([, ok]) => !ok).map(([f]) => f); truthy(!missing.length, missing.join(', ')); });

    // --- Jazyková kontrola: známe chyby sa nevrátili ---
    test('slovenský obsah neobsahuje opravené chyby', () => {
      const text = JSON.stringify(CONTENT.sk) + JSON.stringify(DICTS.sk, (k, v) => (typeof v === 'function' ? String(v) : v));
      ['vykričník', 'Rozdeľ hesla', 'hesla sa zmenia', 'má pes ', 'Pri problému', 'nebojí trestu', 'vydierajú', 'a mená.'].forEach((bad) => truthy(!text.includes(bad), bad));
    });

    // --- Úložisko: nikdy nie heslá ---
    test('localStorage neobsahuje zadané testovacie heslá', () => {
      const raw = JSON.stringify(Object.fromEntries(Object.keys(localStorage).map((k) => [k, localStorage.getItem(k)])));
      truthy(!raw.includes('SlonDazdnikRaketa'));
    });

    setLang(originalLang);
    document.getElementById('summary').textContent = `Hotovo: ${pass} úspešných, ${fail} neúspešných`;
    document.getElementById('summary').style.color = fail ? '#ff7f90' : '#3ddc97';
    document.title = fail ? 'TESTY ZLYHALI' : 'TESTY OK';
